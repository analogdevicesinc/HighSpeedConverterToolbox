name: Build Toolbox

on: [push]

jobs:
  build:
    name: Build Toolbox
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CI helpers
        run: >-
          python -m unittest
          CI.scripts.test_get_required_vivado_version
          CI.scripts.test_check_hw_junit
          CI.scripts.test_patch_gtwiz_parser
      - name: Organize Toolbox Dependencies
        run: |
            make -C ./CI/scripts build
            pip3 install -r CI/gen_doc/requirements_doc.txt
            make -C CI/gen_doc doc

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
            release: R2025b
            products: Communications_Toolbox DSP_System_Toolbox Fixed-Point_Designer HDL_Coder Signal_Processing_Toolbox Simulink Simulink_Coder
      - name: Test MATLAB R2025b compatibility
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath(pwd); addpath(fullfile(pwd,'test'));
            results = runtests({'test/ReleaseCompatibilityTests.m',
            'test/R2025bCompatibilityTests.m'}); assertSuccess(results)
      - name: Test toolbox behavior
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            addpath(pwd); addpath(fullfile(pwd,'test'));
            results = runtests({'test/NonHWTest.m', 'test/AD9081Tests.m'});
            assertSuccess(results)
      - name: Compile Toolbox
        uses: matlab-actions/run-command@v2
        with:
            command: cd('CI/scripts');genTlbx(1);exit()

      - name: Move generated .mltbx file
        run: |
            mkdir toolbox
            cp *.mltbx toolbox

      - name: Save generated .mltbx file
        uses: actions/upload-artifact@v4
        with:
          name: HighSpeedConverterToolboxInstaller
          path: toolbox

      - name: Post development build to GH releases page
        uses: "marvinpinto/action-automatic-releases@latest"
        if: github.ref == 'refs/heads/master'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Latest Development Build"
          files: toolbox
